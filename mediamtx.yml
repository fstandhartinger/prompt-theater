logLevel: info
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 7
# One second keeps the very first playlist within reach of short scenes; the compositor
# holds a single permanent publisher, so the muxer is never torn down between scenes.
hlsSegmentDuration: 1s
readTimeout: 30s
writeTimeout: 30s
paths:
  all_others:
    source: publisher
    runOnReady: "sh -c 'if [ -n \"$X_RTMP_URL\" ] && [ -n \"$X_RTMP_KEY\" ]; then exec ffmpeg -nostdin -loglevel warning -i rtsp://127.0.0.1:8554/$MTX_PATH -c copy -f flv \"${X_RTMP_URL%/}/$X_RTMP_KEY\"; fi'"
    runOnReadyRestart: yes
