<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Theater — your idea, aired live</title>
  <desc id="desc">An illustration of Prompt Theater's live stage, where an audience-written idea becomes an AI-generated video in a public stream.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b4a"/>
      <stop offset=".52" stop-color="#58324b"/>
      <stop offset="1" stop-color="#c45650"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".42" r=".68">
      <stop offset="0" stop-color="#ff7565" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff7565" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <clipPath id="screen"><rect x="704" y="190" width="432" height="280" rx="16"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#080a0f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 588H1200" stroke="#252a35"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(66 53)">
      <rect width="36" height="36" rx="11" fill="#ff675b"/>
      <path d="M15 10.5v15l12-7.5z" fill="#160705"/>
    </g>
    <text x="116" y="78" fill="#f4f1ea" font-size="20" font-weight="700" letter-spacing="2.3">PROMPT THEATER</text>
    <g transform="translate(1030 57)">
      <circle cx="7" cy="7" r="5" fill="#ff675b"/>
      <text x="23" y="12" fill="#ff9b8f" font-size="13" font-weight="700" letter-spacing="1.6">LIVE SHOW</text>
    </g>

    <path d="M68 174h32" stroke="#ff675b" stroke-width="3" stroke-linecap="round"/>
    <text x="111" y="179" fill="#ff9b8f" font-size="13" font-weight="700" letter-spacing="1.6">A LIVE, PARTICIPATORY VIDEO SHOW</text>
    <text x="65" y="278" fill="#f4f1ea" font-size="70" font-weight="700" letter-spacing="-2.8">Your idea,</text>
    <text x="65" y="356" fill="#ff7565" font-size="70" font-weight="700" letter-spacing="-2.8">aired live.</text>
    <text x="69" y="414" fill="#b2b7c1" font-size="22">The audience writes the next scene.</text>
    <text x="69" y="447" fill="#b2b7c1" font-size="22">AI turns it into a clip for the public stream.</text>

    <g filter="url(#shadow)">
      <rect x="665" y="134" width="510" height="402" rx="22" fill="#11151d" stroke="#303642"/>
    </g>
    <g clip-path="url(#screen)">
      <rect x="704" y="190" width="432" height="280" fill="url(#sky)"/>
      <circle cx="1044" cy="244" r="45" fill="#ffc27a" opacity=".95"/>
      <path d="M704 362Q780 314 840 352T966 339T1136 333V470H704Z" fill="#27283c" opacity=".94"/>
      <path d="M704 392Q785 354 870 385T1022 375T1136 391V470H704Z" fill="#171e2a"/>
      <path d="M704 424Q807 398 894 420T1045 413T1136 427V470H704Z" fill="#10151d"/>
      <g fill="#f4d9bf" opacity=".74">
        <circle cx="752" cy="233" r="2"/><circle cx="788" cy="271" r="1.5"/>
        <circle cx="930" cy="220" r="2"/><circle cx="982" cy="288" r="1.5"/>
        <circle cx="1090" cy="313" r="1.5"/><circle cx="862" cy="248" r="1.4"/>
      </g>
      <circle cx="920" cy="329" r="34" fill="#f4f1ea" fill-opacity=".93"/>
      <path d="M914 312v34l27-17z" fill="#141720"/>
    </g>
    <rect x="704" y="190" width="432" height="280" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="724" y="207" width="78" height="25" rx="12.5" fill="#251012" stroke="#68343a"/>
    <circle cx="738" cy="219.5" r="4" fill="#ff675b"/>
    <text x="750" y="224" fill="#ffb1a7" font-size="10" font-weight="700" letter-spacing="1.1">ON AIR</text>
    <text x="724" y="500" fill="#a2a8b4" font-size="12" font-weight="700" letter-spacing="1.4">ILLUSTRATIVE STAGE</text>
    <rect x="724" y="514" width="419" height="4" rx="2" fill="#282e38"/>
    <rect x="724" y="514" width="251" height="4" rx="2" fill="#ff7565"/>

    <g transform="translate(69 506)">
      <rect width="143" height="30" rx="15" fill="#141820" stroke="#303642"/>
      <text x="71.5" y="20" text-anchor="middle" fill="#c1c6cf" font-size="11" font-weight="700" letter-spacing=".8">AUDIENCE-WRITTEN</text>
      <rect x="155" width="126" height="30" rx="15" fill="#141820" stroke="#303642"/>
      <text x="218" y="20" text-anchor="middle" fill="#c1c6cf" font-size="11" font-weight="700" letter-spacing=".8">AI-GENERATED</text>
    </g>
    <text x="69" y="575" fill="#747d8c" font-size="14">prompt-theater.app.mintapis.com</text>
    <text x="1141" y="575" text-anchor="end" fill="#747d8c" font-size="12">Illustrative product visual · example only</text>
  </g>
</svg>
